<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ゴルフコンペ リアルタイムスコア共有</title>
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

  <style>
    body { font-family: sans-serif; padding: 12px; max-width: 700px; margin: 0 auto; background: #f4f6f8; color: #334155; }
    .card { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); margin-bottom: 15px; }
    h1 { font-size: 1.25em; color: #1e293b; margin-top: 0; }
    h2 { font-size: 1em; color: #1e3a8a; margin-bottom: 8px; border-bottom: 2px solid #3b82f6; padding-bottom: 4px; }
    
    .tab-group { display: flex; gap: 6px; margin-bottom: 12px; overflow-x: auto; padding-bottom: 4px; }
    .btn-tab { flex: 1; min-width: 50px; padding: 8px; border: 1px solid #cbd5e1; background: #e2e8f0; font-weight: bold; border-radius: 6px; cursor: pointer; text-align: center; }
    .btn-tab.active { background: #2563eb; color: white; border-color: #2563eb; }

    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
    input, select, button { width: 100%; padding: 8px; margin-top: 4px; border-radius: 6px; border: 1px solid #ccc; box-sizing: border-box; }

    .btn-submit { background: #27ae60; color: white; font-weight: bold; padding: 12px; border: none; border-radius: 6px; cursor: pointer; margin-top: 10px; font-size: 1em; }
    .btn-submit:hover { background: #219150; }
    .btn-share-line { background: #06c755; color: white; font-weight: bold; padding: 10px; border: none; border-radius: 6px; cursor: pointer; text-decoration: none; display: block; text-align: center; margin-top: 6px; }

    table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 0.85em; }
    th, td { border: 1px solid #ddd; padding: 6px 4px; text-align: center; }
    th { background: #eef2f5; }

    .rank-1 { background: #fef08a; font-weight: bold; }
    .badge-team { padding: 2px 6px; border-radius: 4px; font-weight: bold; font-size: 0.75em; background: #dbeafe; color: #1e3a8a; }
    .group-setup-box { background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 8px; padding: 10px; margin-bottom: 10px; }
    .group-setup-title { font-weight: bold; color: #1e3a8a; font-size: 0.9em; margin-bottom: 6px; }
    .player-inputs-row { display: grid; grid-template-columns: 2fr 1fr; gap: 6px; margin-bottom: 6px; }
  </style>
</head>
<body>

  <h1>⛳️ コンペ スコアリアルタイム共有</h1>

  <!-- 幹事用 設定画面 -->
  <div class="card" id="setup-sec">
    <h2>👑 幹事用 コンペ作成 & メンバー登録</h2>
    
    <label>コンペ名 / ルーム名</label>
    <input type="text" id="roomTitle" value="第1回ゴルフコンペ" placeholder="例: サークルコンペ">

    <label style="margin-top:10px;">組数（チーム数）</label>
    <select id="groupCountSelect" onchange="renderGroupSetupForms()">
      <option value="2">2組 (6〜8名)</option>
      <option value="3" selected>3組 (9〜12名)</option>
      <option value="4">4組 (12〜16名)</option>
      <option value="5">5組 (15〜20名)</option>
    </select>

    <div id="group-inputs-container" style="margin-top:15px;"></div>

    <button class="btn-submit" onclick="createTournament()">コンペを作成してLINE共有リンクを発行</button>
  </div>

  <!-- LINE共有リンク表示エリア -->
  <div class="card" id="share-sec" style="display:none;">
    <h2>📲 各組代表者への共有用リンク</h2>
    <p style="font-size:0.8em; color:#64748b;">各組の代表者に、下のボタンからLINEでリンクを送信してください。</p>
    <div id="share-buttons-list"></div>
    <button class="btn-submit" onclick="startAppAsHost()" style="background:#3b82f6; margin-top:15px;">幹事としてリーダーボードを開く</button>
  </div>

  <!-- スコア入力エリア（代表者用） -->
  <div class="card" id="input-sec" style="display:none;">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h2 id="input-group-title">スコア入力</h2>
      <span style="color:#27ae60; font-size:0.8em; font-weight:bold;">● リアルタイム同期中</span>
    </div>

    <!-- ホール選択タブ (1〜18ホール) -->
    <div class="tab-group" id="hole-tabs"></div>

    <div id="player-input-list"></div>

    <button class="btn-submit" onclick="saveHoleScores()">このホールのスコアを送信</button>
  </div>

  <!-- リーダーボード（チーム対抗 ＆ 個人総合） -->
  <div class="card" id="board-sec" style="display:none;">
    <h2>🏆 チーム対抗 順位（各組ベスト2合計）</h2>
    <table>
      <thead>
        <tr>
          <th>順位</th>
          <th>チーム</th>
          <th>チーム通算打数</th>
        </tr>
      </thead>
      <tbody id="team-rank-body"></tbody>
    </table>

    <h2 style="margin-top:20px;">👤 個人総合リーダーボード</h2>
    <table>
      <thead>
        <tr>
          <th>順位</th>
          <th>組</th>
          <th>名前</th>
          <th>ネット打数 (グロス)</th>
          <th>獲得P</th>
        </tr>
      </thead>
      <tbody id="player-rank-body"></tbody>
    </table>
  </div>

  <script>
    // Firebase 設定[cite: 1]
    const firebaseConfig = {
      databaseURL: "https://okadagolf-app-default-rtdb.firebaseio.com/"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let roomId = "";
    let myGroup = 0;
    let selectedHole = 1;
    let globalData = { players: {}, scores: {} };

    window.onload = function() {
      const urlParams = new URLSearchParams(window.location.search);
      const roomParam = urlParams.get('room');
      const groupParam = urlParams.get('group');

      if (roomParam && groupParam) {
        roomId = roomParam;
        myGroup = parseInt(groupParam);
        startApp();
      } else {
        renderGroupSetupForms();
      }
    };

    // 各組最大4名までの入力枠生成
    function renderGroupSetupForms() {
      const count = parseInt(document.getElementById('groupCountSelect').value);
      const container = document.getElementById('group-inputs-container');
      container.innerHTML = '';

      for (let g = 1; g <= count; g++) {
        let html = `
          <div class="group-setup-box">
            <div class="group-setup-title">🚩 ${g}組目 メンバー設定（最大4名）</div>
            <div class="player-inputs-row">
              <input type="text" id="g${g}-p1-name" value="${g}組 プレイヤー1" placeholder="プレイヤー1 名前">
              <input type="number" id="g${g}-p1-hdcp" value="0" placeholder="HDCP">
            </div>
            <div class="player-inputs-row">
              <input type="text" id="g${g}-p2-name" value="${g}組 プレイヤー2" placeholder="プレイヤー2 名前">
              <input type="number" id="g${g}-p2-hdcp" value="0" placeholder="HDCP">
            </div>
            <div class="player-inputs-row">
              <input type="text" id="g${g}-p3-name" value="${g}組 プレイヤー3" placeholder="プレイヤー3 名前">
              <input type="number" id="g${g}-p3-hdcp" value="0" placeholder="HDCP">
            </div>
            <div class="player-inputs-row">
              <input type="text" id="g${g}-p4-name" value="" placeholder="プレイヤー4 名前（3名組の場合は空欄）">
              <input type="number" id="g${g}-p4-hdcp" value="0" placeholder="HDCP">
            </div>
          </div>
        `;
        container.innerHTML += html;
      }
    }

    function createTournament() {
      const title = document.getElementById('roomTitle').value.trim() || "ゴルフコンペ";
      const count = parseInt(document.getElementById('groupCountSelect').value);
      
      roomId = "room-" + Math.random().toString(36).substring(2, 8);
      
      let players = {};
      let pCount = 0;

      for (let g = 1; g <= count; g++) {
        for (let p = 1; p <= 4; p++) {
          const nameInput = document.getElementById(`g${g}-p${p}-name`);
          const hdcpInput = document.getElementById(`g${g}-p${p}-hdcp`);

          if (nameInput && nameInput.value.trim() !== "") {
            pCount++;
            players[`p${pCount}`] = {
              name: nameInput.value.trim(),
              hdcp: parseInt(hdcpInput.value) || 0,
              group: g
            };
          }
        }
      }

      db.ref(`rooms/${roomId}`).set({
        title: title,
        groupCount: count,
        players: players,
        scores: {}
      }).then(() => {
        renderShareButtons(count);
      }).catch((err) => {
        alert("通信エラーが発生しました: " + err.message);
      });
    }

    function renderShareButtons(count) {
      document.getElementById('setup-sec').style.display = 'none';
      document.getElementById('share-sec').style.display = 'block';

      const list = document.getElementById('share-buttons-list');
      list.innerHTML = '';

      const baseUrl = window.location.href.split('?')[0];

      for (let g = 1; g <= count; g++) {
        const shareUrl = `${baseUrl}?room=${roomId}&group=${g}`;
        const lineText = encodeURIComponent(`【ゴルフコンペ】${g}組目のスコア入力用リンクです：\n${shareUrl}`);
        const lineUrl = `https://line.me/R/msg/text/?${lineText}`;

        list.innerHTML += `
          <div style="background:#f1f5f9; border:1px solid #cbd5e1; padding:10px; border-radius:8px; margin-bottom:10px;">
            <div style="font-weight:bold; font-size:0.9em; margin-bottom:6px;">🚩 ${g}組目用アクセスリンク</div>
            <a href="${lineUrl}" target="_blank" class="btn-share-line">📱 ${g}組目 代表者へLINEで送信</a>
          </div>
        `;
      }
    }

    function startAppAsHost() {
      myGroup = 0;
      startApp();
    }

    function startApp() {
      document.getElementById('setup-sec').style.display = 'none';
      document.getElementById('share-sec').style.display = 'none';

      if (myGroup > 0) {
        document.getElementById('input-sec').style.display = 'block';
        document.getElementById('input-group-title').innerText = `${myGroup}組目のスコア入力`;
      }

      document.getElementById('board-sec').style.display = 'block';

      initHoleTabs();

      db.ref(`rooms/${roomId}`).on('value', (snapshot) => {
        const val = snapshot.val();
        if (val) {
          globalData = val;
        }
        if (myGroup > 0) renderInputForm();
        calculateLeaderboard();
      });
    }

    function initHoleTabs() {
      const tabContainer = document.getElementById('hole-tabs');
      tabContainer.innerHTML = '';
      for (let h = 1; h <= 18; h++) {
        tabContainer.innerHTML += `
          <button class="btn-tab ${h === 1 ? 'active' : ''}" id="tab-h${h}" onclick="selectHole(${h})">${h}H</button>
        `;
      }
    }

    function selectHole(h) {
      selectedHole = h;
      for (let i = 1; i <= 18; i++) {
        const btn = document.getElementById(`tab-h${i}`);
        if (btn) btn.className = `btn-tab ${i === h ? 'active' : ''}`;
      }
      if (myGroup > 0) renderInputForm();
    }

    function renderInputForm() {
      const list = document.getElementById('player-input-list');
      list.innerHTML = `<p style="font-size:0.85em; font-weight:bold; margin-bottom:8px;">【${selectedHole}番ホール】打数＆オリンピック入力</p>`;

      const groupPlayers = Object.entries(globalData.players || {})
        .filter(([id, p]) => p.group === myGroup);

      const holeScores = (globalData.scores && globalData.scores[selectedHole]) || {};

      groupPlayers.forEach(([pId, p]) => {
        const curScore = holeScores[pId] ? holeScores[pId].score : 4;
        const curOly = holeScores[pId] ? holeScores[pId].olympic || "" : "";

        list.innerHTML += `
          <div style="background:#f8fafc; border:1px solid #e2e8f0; padding:8px; border-radius:6px; margin-bottom:8px;">
            <div style="font-weight:bold; font-size:0.9em; margin-bottom:4px;">${p.name} (HDCP:${p.hdcp})</div>
            <div class="grid-3">
              <div>
                <span style="font-size:0.7em;">打数</span>
                <input type="number" id="input-score-${pId}" value="${curScore}" min="1">
              </div>
              <div style="grid-column: span 2;">
                <span style="font-size:0.7em;">オリンピック</span>
                <select id="input-oly-${pId}">
                  <option value="" ${curOly===''?'selected':''}>なし</option>
                  <option value="gold" ${curOly==='gold'?'selected':''}>🥇 金(+4)</option>
                  <option value="silver" ${curOly==='silver'?'selected':''}>🥈 銀(+3)</option>
                  <option value="bronze" ${curOly==='bronze'?'selected':''}>🥉 銅(+2)</option>
                  <option value="iron" ${curOly==='iron'?'selected':''}>鉄(+1)</option>
                  <option value="dia" ${curOly==='dia'?'selected':''}>💎 ダイヤ(+5)</option>
                </select>
              </div>
            </div>
          </div>
        `;
      });
    }

    function saveHoleScores() {
      const groupPlayers = Object.entries(globalData.players || {})
        .filter(([id, p]) => p.group === myGroup);

      groupPlayers.forEach(([pId]) => {
        const scoreVal = parseInt(document.getElementById(`input-score-${pId}`).value) || 4;
        const olyVal = document.getElementById(`input-oly-${pId}`).value;

        db.ref(`rooms/${roomId}/scores/${selectedHole}/${pId}`).set({
          score: scoreVal,
          olympic: olyVal
        });
      });

      alert(`${selectedHole}番ホールのスコアを送信しました！`);
    }

    function calculateLeaderboard() {
      const players = globalData.players || {};
      const scores = globalData.scores || {};

      let teamTotals = {};
      let playerTotals = {};

      Object.keys(players).forEach(pId => {
        playerTotals[pId] = { ...players[pId], gross: 0, net: 0, points: 0 };
        teamTotals[players[pId].group] = 0;
      });

      Object.keys(scores).forEach(h => {
        const hScores = scores[h];
        let groupHoleScores = {};

        Object.keys(players).forEach(pId => {
          const g = players[pId].group;
          if (!groupHoleScores[g]) groupHoleScores[g] = [];

          if (hScores[pId]) {
            const rawScore = hScores[pId].score;
            const netScore = Math.max(1, rawScore - players[pId].hdcp);

            playerTotals[pId].gross += rawScore;
            playerTotals[pId].net += netScore;

            groupHoleScores[g].push(netScore);

            const oly = hScores[pId].olympic;
            if(oly === 'gold') playerTotals[pId].points += 12;
            if(oly === 'silver') playerTotals[pId].points += 9;
            if(oly === 'bronze') playerTotals[pId].points += 6;
            if(oly === 'iron') playerTotals[pId].points += 3;
            if(oly === 'dia') playerTotals[pId].points += 15;
          }
        });

        Object.keys(groupHoleScores).forEach(g => {
          if (groupHoleScores[g].length >= 2) {
            groupHoleScores[g].sort((a, b) => a - b);
            teamTotals[g] += (groupHoleScores[g][0] + groupHoleScores[g][1]);
          }
        });
      });

      const teamBody = document.getElementById('team-rank-body');
      teamBody.innerHTML = '';
      const sortedTeams = Object.keys(teamTotals).sort((a, b) => teamTotals[a] - teamTotals[b]);

      sortedTeams.forEach((g, idx) => {
        teamBody.innerHTML += `
          <tr class="${idx === 0 ? 'rank-1' : ''}">
            <td>${idx + 1}位</td>
            <td><span class="badge-team">${g}組目 チーム</span></td>
            <td><b>${teamTotals[g]} 打</b></td>
          </tr>
        `;
      });

      const playerBody = document.getElementById('player-rank-body');
      playerBody.innerHTML = '';
      const sortedPlayers = Object.values(playerTotals).sort((a, b) => a.net - b.net);

      sortedPlayers.forEach((p, idx) => {
        playerBody.innerHTML += `
          <tr class="${idx === 0 ? 'rank-1' : ''}">
            <td>${idx + 1}位</td>
            <td><span class="badge-team">${p.group}組</span></td>
            <td><b>${p.name}</b></td>
            <td>${p.net} 打 (${p.gross})</td>
            <td><b>${p.points} P</b></td>
          </tr>
        `;
      });
    }
  </script>
</body>
</html>
